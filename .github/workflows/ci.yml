name: Boutique CI/CD Pipeline

on:
  push:
    branches:
      - dev

  pull_request:
    branches:
      - dev

jobs:
  build:
    runs-on: self-hosted

    strategy:
      fail-fast: false
      matrix:
        service:
          - auth
          - gateway
          - orders
          - order-service
          - product-service
          - user-service
          - frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1.2.0
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Trivy Filesystem Scan
        run: |
          trivy fs \
            --severity HIGH,CRITICAL \
            --exit-code 0 \
            projects/boutique-microservices

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          if [ "${{ matrix.service }}" = "frontend" ]; then
            BUILD_PATH="projects/boutique-microservices/frontend"
          else
            BUILD_PATH="projects/boutique-microservices/backend/services/${{ matrix.service }}"
          fi

          echo "Building from ${BUILD_PATH}"

          docker build \
            -t boutique-${{ matrix.service }}:${{ github.sha }} \
            ${BUILD_PATH}

      - name: Trivy Image Scan
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 0 \
            boutique-${{ matrix.service }}:${{ github.sha }}

      - name: Tag Docker Image
        run: |
          docker tag \
            boutique-${{ matrix.service }}:${{ github.sha }} \
            ${{ secrets.DOCKER_USERNAME }}/boutique-${{ matrix.service }}:${{ github.sha }}

      - name: Push Docker Image
        run: |
          docker push \
            ${{ secrets.DOCKER_USERNAME }}/boutique-${{ matrix.service }}:${{ github.sha }}

  update-manifests:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOTIQUE_GITHUB_TOKEN }}

      - name: Update Backend Manifests
        run: |
          USERNAME=${{ secrets.DOCKER_USERNAME }}
          TAG=${{ github.sha }}

          for SERVICE in auth gateway orders order-service product-service user-service
          do
            FILE="gitops/k8s/backend/${SERVICE}.yml"

            sed -i "s|image:.*|image: ${USERNAME}/boutique-${SERVICE}:${TAG}|g" "$FILE"
          done

      - name: Update Frontend Manifest
        run: |
          USERNAME=${{ secrets.DOCKER_USERNAME }}
          TAG=${{ github.sha }}

          sed -i "s|image:.*|image: ${USERNAME}/boutique-frontend:${TAG}|g" \
            gitops/k8s/frontend/deployment.yml

      - name: Commit and Push Manifest Changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add gitops/k8s/

          if git diff --cached --quiet; then
            echo "No manifest changes."
          else
            git commit -m "ci: update image tags to ${{ github.sha }}"
            git push
          fi

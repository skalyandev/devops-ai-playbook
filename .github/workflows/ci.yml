name: Boutique CI Pipeline Flow

on: 
 push:
   branches:
     - dev

 pull_request:
   branches:
     - dev

jobs:
  build:
    runs-on: self-hosted

    steps: 
      - name: checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Dependencies 
        working-directory: projects/boutique-microservices
        run: npm ci

      - name: Build Project 
        working-directory:  projects/boutique-microservices
        run: npm run build

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN}}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1.2.0
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Trivy Filesystem Scan
        run: |
          trivy fs \
            --severity HIGH,CRITICAL \
            --exit-code 0 \
            projects/boutique-microservices   

      - name: Build Docker Image
        run: |
          docker build \
            -t boutique-frontend:${{ github.sha }} \
          projects/boutique-microservices/frontend   

      - name: Trivy Image Scan
        run: | 
          trivy image \
           --severity HIGH,CRITICAL \
           --exit-code 0 \
           --ignore-unfixed \
           boutique-frontend:${{ github.sha }}

      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Tagging the Docker Image
        run: |
          docker tag boutique-frontend:${{ github.sha }} \
            ${{ secrets.DOCKER_USERNAME }}/boutique-frontend:${{ github.sha }}

      - name: Push the Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/boutique-frontend:${{ github.sha }}




           
